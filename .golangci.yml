version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    staticcheck:
      checks:
        - all
        # Upstream's style: the embedded client and object metadata are named, which shows which
        # client a call goes through.
        - -QF1008
        # golangci-lint's own defaults: package comments and naming conventions.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    gosec:
      excludes:
        # Integer conversions between replica counts and Talos API fields are bounded by the API.
        - G115
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      # The served v1alpha3 API is built on Cluster API's v1beta1 types until it stops being served.
      - path: api/v1alpha3/
        linters: [staticcheck]
        text: SA1019
      # The v1beta1 status block and the deprecated fields stay populated while clients may read them.
      - linters: [staticcheck]
        text: 'SA1019: .*(V1Beta1Deprecated|v1beta2\.Conditions is|\.InitConfig is|TalosConfigStatus\)\.TalosConfig is)'
      - path: _test\.go
        linters: [gosec]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubehenge/cluster-api-control-plane-provider-talos
