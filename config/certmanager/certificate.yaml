# The following manifests contain a self-signed issuer CR and a certificate CR.
# More document can be found at https://docs.cert-manager.io
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert # this name should match the one in config/default/kustomization.yaml
  namespace: system
spec:
  # The replacements in config/default/kustomization.yaml fill in the webhook service's name and namespace.
  dnsNames:
    - SERVICE_NAME_PLACEHOLDER.SERVICE_NAMESPACE_PLACEHOLDER.svc
    - SERVICE_NAME_PLACEHOLDER.SERVICE_NAMESPACE_PLACEHOLDER.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  # The manager's volume in config/default/manager_webhook_patch.yaml mounts this secret.
  secretName: cacppt-webhook-service-cert
