# A TalosControlPlaneTemplate for a ClusterClass. It has no machineTemplate.spec.infrastructureRef:
# ClusterClass.spec.controlPlane.machineInfrastructure.templateRef provides it.
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: TalosControlPlaneTemplate
metadata:
  name: talos-cp-template
spec:
  template:
    spec:
      machineNamingStrategy:
        template: "{{ .talosControlPlane.name }}-{{ .random }}"
      machineTemplate:
        metadata:
          labels:
            example.com/control-plane: "true"
      controlPlaneConfig:
        controlplane:
          generateType: controlplane
          talosVersion: v1.14
          strategicPatches:
            - |
              apiVersion: v1alpha1
              kind: UnattendedInstallConfig
              provisioning:
                diskSelector:
                  match: disk.dev_path == "/dev/sda"
