namespace: cacppt-system

namePrefix: cacppt-

labels:
  - pairs:
      cluster.x-k8s.io/provider: "control-plane-talos"
    includeSelectors: true

resources:
  - namespace.yaml
  - ../crd
  - ../certmanager
  - ../webhook
  - ../rbac
  - ../manager

patches:
  - path: manager_webhook_patch.yaml
  - path: webhookcainjection_patch.yaml

# The webhook certificate names the service it serves, and cert-manager injects its CA into the
# webhook configurations and the CRDs. The names and namespaces are the ones prefixed above.
replacements:
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 0
  - source:
      kind: Service
      version: v1
      name: webhook-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          group: cert-manager.io
          version: v1
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: "."
          index: 1
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
      - select:
          kind: CustomResourceDefinition
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 0
  - source:
      kind: Certificate
      group: cert-manager.io
      version: v1
      name: serving-cert
      fieldPath: metadata.name
    targets:
      - select:
          kind: ValidatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: MutatingWebhookConfiguration
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
      - select:
          kind: CustomResourceDefinition
        fieldPaths:
          - metadata.annotations.[cert-manager.io/inject-ca-from]
        options:
          delimiter: "/"
          index: 1
