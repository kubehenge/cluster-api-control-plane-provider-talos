---
name: ci

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # The Go hack/install-go.sh installs, never a toolchain go.mod would have it download.
  GOTOOLCHAIN: local

jobs:
  checks:
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [lint, generated, unit, integration, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go
        run: |
          hack/install-go.sh "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - name: Lint
        if: matrix.target == 'lint'
        run: make lint
      - name: Generated files
        if: matrix.target == 'generated'
        run: |
          go mod tidy -diff
          make generate manifests
          make check-dirty
      - name: Unit tests
        if: matrix.target == 'unit'
        run: make unit
      - name: Integration tests
        if: matrix.target == 'integration'
        run: make envtest integration
      - name: Image and manifests
        if: matrix.target == 'build'
        run: |
          ref=$(make -s image KO_FLAGS=--push=false TAG=ci | tail -n 1)
          case $ref in
            ghcr.io/kubehenge/cluster-api-control-plane-provider-talos@sha256:*) ;;
            *) echo "::error::ko printed no image digest: $ref"; exit 1 ;;
          esac
          make release-manifests CONTROLLER_IMAGE="$ref"
          grep -q "image: $ref" _out/release/control-plane-components.yaml
