---
name: release

# A version tag publishes a release: the controller image on ghcr.io, signed with Sigstore's keyless
# signing and carrying build provenance, and the clusterctl manifests naming that image by digest.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write # the release and its files
      packages: write # the image on ghcr.io
      id-token: write # keyless image signature and build provenance
      attestations: write # build provenance stored with the repository
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build caches: a cache written by another workflow's run could reach what is released.
      - name: Go
        run: |
          hack/install-go.sh "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - name: Checks
        run: |
          make generate manifests
          make check-dirty
          make lint unit envtest integration

      - name: Image
        id: image
        run: |
          make tools
          echo "$GH_TOKEN" | _out/bin/ko login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref=$(make -s image TAG="$GITHUB_REF_NAME" | tail -n 1)
          case $ref in
            ghcr.io/kubehenge/cluster-api-control-plane-provider-talos@sha256:*) ;;
            *) echo "::error::ko printed no image digest: $ref"; exit 1 ;;
          esac
          _out/bin/cosign sign --yes "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/kubehenge/cluster-api-control-plane-provider-talos
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Manifests
        env:
          CONTROLLER_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          make release-manifests CONTROLLER_IMAGE="$CONTROLLER_IMAGE"
          cd _out/release
          sha256sum control-plane-components.yaml metadata.yaml > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            _out/release/control-plane-components.yaml
            _out/release/metadata.yaml

      - name: Publish
        env:
          CONTROLLER_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          printf 'Image: `%s`\n\n' "$CONTROLLER_IMAGE" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease --generate-notes \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            _out/release/control-plane-components.yaml _out/release/metadata.yaml _out/release/SHA256SUMS
